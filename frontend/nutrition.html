<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ernährung - AI Athletik-Coach</title>
  <link rel="stylesheet" href="index.css">
  <style>
    .progress-wrapper { margin-bottom: 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-secondary); }
    .progress-track { height: 10px; background: var(--bg-input); border-radius: var(--radius-full); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: var(--radius-full); transition: width var(--duration-base) var(--ease-out); }
    
    .fill-cal { background: var(--warning); }
    .fill-prot { background: hsl(175, 70%, 55%); }
    .fill-carbs { background: hsl(200, 80%, 60%); }
    .fill-fat { background: hsl(280, 60%, 65%); }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__icon">🍽️</div>
        <div>
          <div class="sidebar__title">AI Coach</div>
          <div class="sidebar__subtitle">Ernährung</div>
        </div>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar-nav-link">🏠 Dashboard</a>
        <a href="nutrition.html" class="sidebar-nav-link active">🍽️ Ernährung</a>
        <a href="health.html" class="sidebar-nav-link">❤️ Health & Training</a>
        <a href="coach.html" class="sidebar-nav-link">🧠 AI Coach</a>
        <a href="history.html" class="sidebar-nav-link">📅 Historie</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="app-header">
        <h1 class="app-header__title-main">Ernährung</h1>
        <div class="app-header__date" id="header-date"></div>
      </header>

      <main class="dashboard-grid">
        <!-- Ernährungs-Tracker Formular -->
        <section class="card" id="nutrition-section">
          <div class="card__header">
            <h2 class="card__title">
              <span class="card__title-icon">🍽️</span>
              Mahlzeit hinzufügen
            </h2>
          </div>

          <form id="food-form" autocomplete="off">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="food-name">Lebensmittel</label>
                <input class="form-input" type="text" id="food-name" placeholder="z.B. Skyr, Apfel…" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="meal-label">Mahlzeit</label>
                <select class="form-select" id="meal-label">
                  <option value="breakfast">🌅 Frühstück</option>
                  <option value="lunch">☀️ Mittagessen</option>
                  <option value="dinner">🌙 Abendessen</option>
                  <option value="snack">🍎 Snack</option>
                </select>
              </div>
            </div>

            <div class="form-row--4">
              <div class="form-group">
                <label class="form-label" for="food-amount">Menge (g)</label>
                <input class="form-input" type="number" id="food-amount" placeholder="150" min="0" step="1">
              </div>
              <div class="form-group">
                <label class="form-label" for="food-calories">Kalorien</label>
                <input class="form-input" type="number" id="food-calories" placeholder="kcal" min="0" step="1">
              </div>
              <div class="form-group">
                <label class="form-label" for="food-protein">Protein (g)</label>
                <input class="form-input" type="number" id="food-protein" placeholder="0" min="0" step="0.1">
              </div>
              <div class="form-group">
                <label class="form-label" for="food-carbs">Carbs (g)</label>
                <input class="form-input" type="number" id="food-carbs" placeholder="0" min="0" step="0.1">
              </div>
            </div>

            <div class="form-row--3">
              <div class="form-group">
                <label class="form-label" for="food-fat">Fett (g)</label>
                <input class="form-input" type="number" id="food-fat" placeholder="0" min="0" step="0.1">
              </div>
              <div class="form-group">
                <label class="form-label" for="food-fiber">Ballaststoffe (g)</label>
                <input class="form-input" type="number" id="food-fiber" placeholder="0" min="0" step="0.1">
              </div>
              <div class="form-group" style="display:flex;align-items:flex-end;">
                <button type="submit" class="btn btn--primary btn--block btn--sm" id="food-submit-btn">
                  <span class="spinner"></span>
                  <span class="btn__text">+ Hinzufügen</span>
                </button>
              </div>
            </div>
          </form>
        </section>

        <!-- Tagesziele & Fortschrittsbalken -->
        <section class="card">
          <div class="card__header">
            <h2 class="card__title">
              <span class="card__title-icon">📊</span>
              Tagesziele
            </h2>
          </div>
          
          <div class="progress-wrapper">
            <div class="progress-label"><span>Kalorien</span><span id="progress-cal-text">0 / 2500 kcal</span></div>
            <div class="progress-track"><div class="progress-fill fill-cal" id="progress-cal-fill" style="width: 0%"></div></div>
          </div>
          
          <div class="progress-wrapper">
            <div class="progress-label"><span>Protein</span><span id="progress-prot-text">0 / 150 g</span></div>
            <div class="progress-track"><div class="progress-fill fill-prot" id="progress-prot-fill" style="width: 0%"></div></div>
          </div>
          
          <div class="progress-wrapper">
            <div class="progress-label"><span>Kohlenhydrate</span><span id="progress-carbs-text">0 / 250 g</span></div>
            <div class="progress-track"><div class="progress-fill fill-carbs" id="progress-carbs-fill" style="width: 0%"></div></div>
          </div>
          
          <div class="progress-wrapper">
            <div class="progress-label"><span>Fett</span><span id="progress-fat-text">0 / 80 g</span></div>
            <div class="progress-track"><div class="progress-fill fill-fat" id="progress-fat-fill" style="width: 0%"></div></div>
          </div>
        </section>

        <!-- Heutiges Food-Log (Volle Breite) -->
        <section class="card dashboard-grid__report">
          <div class="card__header">
            <h2 class="card__title">
              <span class="card__title-icon">📋</span>
              Logbuch von Heute
            </h2>
            <span class="card__badge" id="nutrition-meal-count">0 Einträge</span>
          </div>
          <div class="food-log" id="food-log" style="max-height: 400px;">
            <div class="food-log__empty">
              <span class="food-log__empty-icon">📋</span>
              Noch keine Einträge heute.
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="nutrition.js"></script>
</body>
</html>
